name: Compilar o aplicativo (Windows)
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-app.txt pyinstaller
      - run: pyinstaller app/build/chelis.spec --noconfirm
      - name: Teste rápido do aplicativo compilado
        run: |
          & "dist/Chelisplace_Simba (bot)/Chelisplace_Simba (bot).exe" --selftest
      - run: Compress-Archive -LiteralPath "dist/Chelisplace_Simba (bot)" -DestinationPath Chelisplace_Simba_bot.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chelisplace_Simba_bot
          path: Chelisplace_Simba_bot.zip
      - name: Publicar o zip como Release (link fixo para a página baixar)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bot-latest --yes --cleanup-tag || true
          gh release create bot-latest Chelisplace_Simba_bot.zip --title "Bot Chelisplace (última versão)" --notes "Gerado automaticamente a partir de ${{ github.sha }}." --target ${{ github.sha }}
